    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- DATA BASE (From provided PDF) ---
        const database = [
            // ADDITION & SEQUENCE
            { word: "and", meaning: "y", example: "She studies English [blank] French.", exampleEs: "Ella estudia inglés y francés.", explanation: "'And' conecta elementos o ideas similares añadiendo información.", usage: "Úsalo en medio de la oración para unir elementos de la misma categoría o ideas sin contraste.", category: "Addition" },
            { word: "also", meaning: "también", example: "He [blank] enjoys reading.", exampleEs: "Él también disfruta leer.", explanation: "'Also' se usa para añadir una idea extra que complementa la anterior.", usage: "Úsalo típicamente antes del verbo principal o después del verbo 'to be' para añadir información a una idea ya mencionada.", category: "Addition" },
            { word: "moreover", meaning: "además / es más", example: "It is cheap; [blank], it is reliable.", exampleEs: "Es barato; además, es confiable.", explanation: "'Moreover' añade información que refuerza fuertemente el punto anterior.", usage: "Úsalo al inicio de una nueva oración o después de un punto y coma, seguido de una coma, en contextos muy formales o académicos.", category: "Addition" },
            { word: "furthermore", meaning: "además", example: "[blank], the results were positive.", exampleEs: "Además, los resultados fueron positivos.", explanation: "'Furthermore' introduce un punto adicional a un argumento (formal).", usage: "Úsalo igual que 'moreover', al principio de la oración con coma, para escalar o añadir peso a un argumento previo.", category: "Addition" },
            { word: "in addition", meaning: "además", example: "[blank], we have more time.", exampleEs: "Además, tenemos más tiempo.", explanation: "'In addition' se usa para sumar un nuevo punto o argumento.", usage: "Úsalo al principio de una oración (seguido de coma) o como 'in addition to' seguido de un sustantivo o verbo en -ing.", category: "Addition" },
            { word: "besides", meaning: "además / aparte de", example: "[blank] English, she studies French.", exampleEs: "Aparte del inglés, ella estudia francés.", explanation: "'Besides' significa 'aparte de' o 'además de' lo ya mencionado.", usage: "Úsalo seguido de un sustantivo/pronombre para decir 'además de esto', o al inicio de oración (con coma) para añadir un argumento definitivo.", category: "Addition" },
            { word: "not only ... but also", meaning: "no solo... sino también", example: "It is [blank] useful [blank] easy.", exampleEs: "No es solo útil, sino también fácil.", explanation: "Correlativo que destaca que ambas cualidades están presentes.", usage: "Úsalo separando dos características, verbos o sustantivos para enfatizar fuertemente que ambas ocurren de forma conjunta.", category: "Addition", special: true },
            { word: "first", meaning: "primero", example: "[blank], read the question.", exampleEs: "Primero, lee la pregunta.", explanation: "'First' indica el paso inicial de una secuencia.", usage: "Úsalo al inicio de una oración, generalmente seguido de una coma, para introducir el primer punto de una serie.", category: "Sequence" },
            { word: "firstly", meaning: "primero", example: "[blank], read the question.", exampleEs: "En primer lugar, lee la pregunta.", explanation: "'Firstly' es similar a 'first', usado comúnmente para listar argumentos.", usage: "Úsalo de forma intercambiable con 'first' en contextos formales para el primer argumento de una lista.", category: "Sequence" },
            { word: "next", meaning: "después / a continuación", example: "[blank], choose an answer.", exampleEs: "A continuación, elige una respuesta.", explanation: "'Next' señala la acción inmediatamente posterior.", usage: "Úsalo para transiciones de tiempo o secuencias lógicas de instrucciones, casi siempre al principio con coma.", category: "Sequence" },
            { word: "then", meaning: "luego / entonces", example: "[blank], check the context.", exampleEs: "Luego, revisa el contexto.", explanation: "'Then' indica lo que sucede justo después en el tiempo.", usage: "Úsalo en medio o inicio de oración. A diferencia de 'next', a menudo no lleva coma inmediatamente después.", category: "Sequence" },
            { word: "after that", meaning: "después de eso", example: "[blank], review your work.", exampleEs: "Después de eso, revisa tu trabajo.", explanation: "'After that' hace referencia a una acción que sigue a la recién mencionada.", usage: "Úsalo justo después de describir una acción completada para introducir claramente el siguiente paso.", category: "Sequence" },
            { word: "subsequently", meaning: "posteriormente", example: "She applied and [blank] got a job.", exampleEs: "Ella aplicó y posteriormente consiguió un empleo.", explanation: "'Subsequently' es una forma formal de decir 'después'.", usage: "Úsalo principalmente en inglés formal o escrito para describir eventos posteriores o resultados.", category: "Sequence" },
            { word: "finally", meaning: "finalmente", example: "[blank], submit your answers.", exampleEs: "Finalmente, envía tus respuestas.", explanation: "'Finally' marca el último paso de una lista o proceso.", usage: "Úsalo obligatoriamente al inicio de la oración final (con coma) al terminar una secuencia de eventos o lista de argumentos.", category: "Sequence" },
            
            // CONTRAST & CONCESSION
            { word: "but", meaning: "pero", example: "It was cold, [blank] we went out.", exampleEs: "Hacía frío, pero salimos.", explanation: "'But' introduce un contraste directo e informal.", usage: "Úsalo siempre en medio de la oración para contrastar dos ideas (se antecede con coma si une dos oraciones completas).", category: "Contrast" },
            { word: "however", meaning: "sin embargo", example: "It was late; [blank], we stayed.", exampleEs: "Era tarde; sin embargo, nos quedamos.", explanation: "'However' introduce una idea que contrasta con la anterior (más formal que 'but').", usage: "Úsalo al inicio de oración o tras punto y coma, SIEMPRE seguido de una coma.", category: "Contrast" },
            { word: "whereas", meaning: "mientras que (contraste)", example: "I like tea, [blank] she prefers coffee.", exampleEs: "Me gusta el té, mientras que ella prefiere el café.", explanation: "'Whereas' compara dos hechos que contrastan entre sí.", usage: "Úsalo al principio o en medio de una oración para comparar directamente dos hechos o personas distintas.", category: "Contrast" },
            { word: "while", meaning: "mientras que (contraste)", example: "[blank] he reads, she prefers podcasts.", exampleEs: "Mientras que él lee, ella prefiere los podcasts.", explanation: "'While' se puede usar igual que 'whereas' para contrastar dos cosas.", usage: "Úsalo como equivalente de 'whereas' para contraste (aparte de su uso de tiempo), seguido de sujeto y verbo.", category: "Contrast" },
            { word: "unlike", meaning: "a diferencia de", example: "[blank] John, Ana likes math.", exampleEs: "A diferencia de John, a Ana le gustan las matemáticas.", explanation: "'Unlike' señala que dos cosas o personas no son iguales.", usage: "Úsalo al inicio o final de oración, seguido inmediatamente de un sustantivo o pronombre (nunca de un verbo).", category: "Contrast" },
            { word: "on the other hand", meaning: "por otro lado", example: "It is cheap; [blank], it is slow.", exampleEs: "Es barato; por otro lado, es lento.", explanation: "Presenta un punto de vista o hecho opuesto al recién mencionado.", usage: "Úsalo para presentar una perspectiva alternativa, típicamente después de que ya se presentó un primer punto.", category: "Contrast" },
            { word: "in contrast", meaning: "en cambio / en contraste", example: "[blank], the new method is faster.", exampleEs: "En cambio, el nuevo método es más rápido.", explanation: "Destaca una diferencia notable con algo anterior.", usage: "Úsalo al inicio de una oración, con coma, o como 'in contrast to' + sustantivo.", category: "Contrast" },
            { word: "although", meaning: "aunque (+ oración)", example: "[blank] it rained, we went out.", exampleEs: "Aunque llovió, salimos.", explanation: "'Although' introduce una concesión, seguido de sujeto y verbo.", usage: "Úsalo al principio o en el medio de la frase, obligatoriamente seguido de una cláusula completa (Sujeto + Verbo).", category: "Concession" },
            { word: "even though", meaning: "aunque / a pesar de que", example: "[blank] he was tired, he studied.", exampleEs: "A pesar de que estaba cansado, estudió.", explanation: "Es una versión más enfática de 'although'.", usage: "Úsalo exactamente igual que 'although' (con sujeto y verbo), pero cuando la sorpresa o el obstáculo es más fuerte.", category: "Concession" },
            { word: "despite", meaning: "a pesar de (+ nombre/-ing)", example: "[blank] the rain, we went out.", exampleEs: "A pesar de la lluvia, salimos.", explanation: "'Despite' va seguido de un sustantivo, pronombre o gerundio (-ing), nunca de una oración completa.", usage: "Úsalo seguido SOLO de un sustantivo, pronombre o verbo en -ing. ¡Prohibido poner Sujeto + Verbo justo después!", category: "Concession" },
            { word: "in spite of", meaning: "a pesar de (+ nombre/-ing)", example: "[blank] feeling ill, she worked.", exampleEs: "A pesar de sentirse mal, ella trabajó.", explanation: "Significa lo mismo y funciona gramaticalmente igual que 'despite'.", usage: "Úsalo exactamente con las mismas reglas que 'despite' (Sustantivo, pronombre o -ing).", category: "Concession" },
            { word: "nevertheless", meaning: "no obstante", example: "The test was hard; [blank], she passed.", exampleEs: "El examen era difícil; no obstante, ella aprobó.", explanation: "Muy formal, introduce un resultado sorprendente a pesar de lo dicho antes.", usage: "Úsalo en contextos muy formales, al inicio de una oración o tras punto y coma, seguido de una coma.", category: "Concession" },
            { word: "even so", meaning: "aun así", example: "It was difficult. [blank], we finished.", exampleEs: "Fue difícil. Aun así, terminamos.", explanation: "'Even so' significa 'a pesar de eso' refiriéndose a una oración anterior.", usage: "Úsalo al inicio de una oración, tras un punto, para aceptar la dificultad previa pero mostrar un resultado distinto.", category: "Concession" },

            // CAUSE & RESULT
            { word: "because", meaning: "porque (+ oración)", example: "We stayed in [blank] it was raining.", exampleEs: "Nos quedamos en casa porque estaba lloviendo.", explanation: "'Because' explica la razón y va seguido de sujeto y verbo.", usage: "Úsalo para dar la razón de algo, asegurándote de que le siga una cláusula completa (Sujeto + Verbo).", category: "Cause" },
            { word: "because of", meaning: "debido a (+ nombre)", example: "The game stopped [blank] the rain.", exampleEs: "El juego se detuvo debido a la lluvia.", explanation: "'Because of' se usa antes de un sustantivo para indicar la causa.", usage: "Úsalo seguido únicamente de un sustantivo o pronombre que sea la causa de la acción.", category: "Cause" },
            { word: "since", meaning: "ya que / puesto que", example: "[blank] it was late, we left.", exampleEs: "Ya que era tarde, nos fuimos.", explanation: "Funciona como 'because' pero la causa es obvia o ya se conoce.", usage: "Úsalo al inicio o medio de la oración (Sujeto + Verbo) cuando la razón ya es conocida por el oyente/lector.", category: "Cause" },
            { word: "due to", meaning: "debido a (+ nombre)", example: "The delay was [blank] traffic.", exampleEs: "El retraso fue debido al tráfico.", explanation: "Se utiliza antes de un sustantivo, es más formal que 'because of'.", usage: "Úsalo de forma idéntica a 'because of' (+ sustantivo), comúnmente después del verbo 'to be'.", category: "Cause" },
            { word: "because of this", meaning: "por este motivo", example: "It was unsafe. [blank], we left.", exampleEs: "Era inseguro. Por este motivo, nos fuimos.", explanation: "Conecta la razón mencionada antes con la consecuencia actual.", usage: "Úsalo al inicio de una oración, seguido de coma, para enlazar el resultado actual con la situación anterior.", category: "Cause" },
            { word: "so", meaning: "así que / por eso", example: "It was late, [blank] we left.", exampleEs: "Era tarde, así que nos fuimos.", explanation: "'So' introduce el resultado o consecuencia (muy común al hablar).", usage: "Úsalo a la mitad de la frase para enlazar de manera informal la causa (antes) con el resultado (después).", category: "Result" },
            { word: "therefore", meaning: "por lo tanto", example: "She practiced; [blank], she improved.", exampleEs: "Ella practicó; por lo tanto, mejoró.", explanation: "Formal, indica que el resultado es lógico basado en la causa.", usage: "Úsalo en inglés formal, típicamente después de punto y coma o al inicio de una nueva oración, seguido de coma.", category: "Result" },
            { word: "thus", meaning: "por consiguiente", example: "Costs rose; [blank], prices increased.", exampleEs: "Los costos subieron; por consiguiente, los precios aumentaron.", explanation: "Formal, a menudo se usa en contextos académicos o escritos.", usage: "Úsalo en lenguaje académico/formal para mostrar consecuencia directa, de estructura similar a 'therefore'.", category: "Result" },
            { word: "consequently", meaning: "en consecuencia", example: "He missed the bus; [blank], he was late.", exampleEs: "Perdió el autobús; en consecuencia, llegó tarde.", explanation: "Muestra el efecto directo de una acción anterior.", usage: "Úsalo al inicio de la oración o tras punto y coma, seguido de coma, para enfocar el 'efecto' (la consecuencia).", category: "Result" },
            { word: "as a result", meaning: "como resultado", example: "It rained; [blank], we stayed home.", exampleEs: "Llovió; como resultado, nos quedamos en casa.", explanation: "Expresa de forma clara que algo pasó debido a un evento previo.", usage: "Úsalo para iniciar la oración de la consecuencia, separándolo de la idea principal con una coma.", category: "Result" },
            { word: "hence", meaning: "de ahí que / por tanto", example: "The road was closed; [blank] the delay.", exampleEs: "La carretera estaba cerrada; de ahí el retraso.", explanation: "Formal. A menudo se usa sin un verbo justo después.", usage: "Úsalo para mostrar consecuencia; peculiarmente puede ir seguido solo de un sustantivo (ej. 'hence the delay').", category: "Result" },
            { word: "for this reason", meaning: "por esta razón", example: "[blank], we canceled the trip.", exampleEs: "Por esta razón, cancelamos el viaje.", explanation: "Conecta un resultado con una justificación clara previa.", usage: "Úsalo al inicio de una oración (con coma) para asegurar que el lector conecte el resultado con la causa leída previamente.", category: "Result" },
            { word: "accordingly", meaning: "en consecuencia", example: "The plan changed; [blank], we adapted.", exampleEs: "El plan cambió; en consecuencia, nos adaptamos.", explanation: "Significa actuar de una manera que cuadra con la situación.", usage: "Úsalo para indicar que se tomó una acción correspondiente y proporcional a la situación.", category: "Result" },
            
            // EXAMPLES & COMPARISON
            { word: "for example", meaning: "por ejemplo", example: "Many fruits, [blank] apples, have fiber.", exampleEs: "Muchas frutas, por ejemplo las manzanas, tienen fibra.", explanation: "La forma más común de dar ejemplos específicos.", usage: "Úsalo al inicio de oración o intercalado entre comas justo antes del ejemplo.", category: "Illustration" },
            { word: "for instance", meaning: "por ejemplo", example: "Try a sport, [blank] tennis.", exampleEs: "Prueba un deporte, por ejemplo el tenis.", explanation: "Sinónimo directo de 'for example'.", usage: "Se usa exactamente igual que 'for example', ideal para evitar repeticiones al escribir.", category: "Illustration" },
            { word: "such as", meaning: "como/tales como", example: "I like sports [blank] tennis.", exampleEs: "Me gustan los deportes como el tenis.", explanation: "Da ejemplos sin hacer una pausa fuerte en la oración.", usage: "Úsalo seguido DIRECTAMENTE de los ejemplos (sustantivos), sin ponerle una coma después de 'as'.", category: "Illustration" },
            { word: "including", meaning: "incluyendo", example: "Five students, [blank] Ana, passed.", exampleEs: "Cinco estudiantes, incluyendo a Ana, aprobaron.", explanation: "Menciona a alguien o algo como parte de un grupo mayor.", usage: "Úsalo para resaltar que el ejemplo es un subconjunto o una parte del grupo previamente mencionado.", category: "Illustration" },
            { word: "namely", meaning: "a saber / específicamente", example: "We need two things, [blank] time and money.", exampleEs: "Necesitamos dos cosas, específicamente tiempo y dinero.", explanation: "Se usa para ser exacto sobre a qué o a quién te refieres.", usage: "Úsalo antes de nombrar específicamente la totalidad de las cosas o personas a las que acabas de referirte de forma general.", category: "Illustration" },
            { word: "in other words", meaning: "en otras palabras", example: "It is optional; [blank], you can skip it.", exampleEs: "Es opcional; en otras palabras, puedes saltártelo.", explanation: "Explica algo de una manera más simple o clara.", usage: "Úsalo al inicio de una oración (con coma) para reformular o simplificar la explicación anterior.", category: "Illustration" },
            { word: "to illustrate", meaning: "para ilustrar", example: "[blank], consider this example.", exampleEs: "Para ilustrar, considera este ejemplo.", explanation: "Formal, usado antes de dar una demostración o ejemplo claro.", usage: "Úsalo al inicio de una oración (con coma) en ensayos o textos formales antes de presentar un caso de estudio o un gran ejemplo.", category: "Illustration" },
            { word: "similarly", meaning: "de manera similar", example: "Ana studies daily; [blank], Luis reviews.", exampleEs: "Ana estudia a diario; de manera similar, Luis repasa.", explanation: "Muestra que algo ocurre de forma parecida a lo mencionado.", usage: "Úsalo al inicio de una oración (con coma) para conectar dos situaciones que tienen comportamientos parecidos.", category: "Comparison" },
            { word: "likewise", meaning: "igualmente", example: "He enjoys art; [blank], she loves painting.", exampleEs: "Él disfruta el arte; igualmente, ella ama la pintura.", explanation: "Similar a 'similarly', indica similitud o que aplica igual.", usage: "Úsalo como un conector formal (con coma) o al final de frase para decir 'yo también' / 'igualmente'.", category: "Comparison" },
            { word: "equally", meaning: "igualmente / por igual", example: "Both answers are [blank] acceptable.", exampleEs: "Ambas respuestas son igualmente aceptables.", explanation: "Indica que dos cosas tienen el mismo valor, nivel o grado.", usage: "Úsalo justo antes del adjetivo o verbo para enfatizar que ambas cosas están al mismo nivel sin diferencias.", category: "Comparison" },
            { word: "in the same way", meaning: "de la misma manera", example: "[blank], practice helps memory.", exampleEs: "De la misma manera, la práctica ayuda a la memoria.", explanation: "Establece una analogía directa entre dos situaciones.", usage: "Úsalo al principio de la oración, seguido de coma, para establecer que el mecanismo o resultado es idéntico al caso anterior.", category: "Comparison" },
            { word: "just as", meaning: "al igual que", example: "[blank] adults learn, children adapt.", exampleEs: "Al igual que los adultos aprenden, los niños se adaptan.", explanation: "Muestra que dos acciones ocurren de la misma forma.", usage: "Úsalo al principio de la cláusula seguido de un Sujeto + Verbo para plantear una comparación equivalente de acciones.", category: "Comparison" },
            { word: "as ... as", meaning: "tan... como", example: "This task is [blank] easy [blank] the first one.", exampleEs: "Esta tarea es tan fácil como la primera.", explanation: "Estructura comparativa de igualdad.", usage: "Úsalo envolviendo en el centro a un adjetivo (as easy as) o adverbio para indicar que dos elementos empatan en esa cualidad.", category: "Comparison", special: true },
            { word: "similar to", meaning: "similar a", example: "Her answer is [blank] mine.", exampleEs: "Su respuesta es similar a la mía.", explanation: "Compara dos cosas diciendo que tienen mucho en común.", usage: "Úsalo siempre seguido de un sustantivo o pronombre (similar to + Noun) para mostrar semejanza física o conceptual.", category: "Comparison" },

            // TIME, CONDITION & PLACE
            { word: "meanwhile", meaning: "mientras tanto", example: "I cooked; [blank], she cleaned.", exampleEs: "Yo cociné; mientras tanto, ella limpió.", explanation: "Indica que dos cosas pasan al mismo tiempo.", usage: "Úsalo al inicio de la segunda oración (con coma) para describir otra acción que ocurre simultáneamente en otro lado.", category: "Time" },
            { word: "eventually", meaning: "finalmente / con el tiempo", example: "[blank], we found a solution.", exampleEs: "Con el tiempo, encontramos una solución.", explanation: "Algo ocurre después de un tiempo o de mucho esfuerzo.", usage: "Úsalo para indicar que un evento ocurrió a largo plazo, típicamente después de demoras o dificultades.", category: "Time" },
            { word: "at last", meaning: "por fin", example: "[blank], the bus arrived.", exampleEs: "Por fin, llegó el autobús.", explanation: "Indica alivio cuando algo sucede después de una larga espera.", usage: "Úsalo para enfatizar fuertemente que la espera por fin ha terminado (lleva carga emocional de alivio o impaciencia).", category: "Time" },
            { word: "as soon as", meaning: "tan pronto como", example: "Call me [blank] you arrive.", exampleEs: "Llámame tan pronto como llegues.", explanation: "Indica que algo debe pasar inmediatamente después de otra cosa.", usage: "Úsalo seguido de Sujeto + Verbo para marcar inmediatez absoluta entre una acción y la siguiente.", category: "Time" },

                    if (gameMode === 'cloze') {
                        correctAnswer = q.word;
                        prompt = q.example;
                        if (difficulty === 'easy') options = shuffle([q.word, ...getRandomWords(2, q.word)]);
                        if (difficulty === 'medium') options = shuffle([q.word, ...getRandomWords(3, q.word, q.category)]);
                    } else if (gameMode === 'translation') {
                        correctAnswer = q.word;
                        prompt = q.meaning;
                        if (difficulty === 'easy') options = shuffle([q.word, ...getRandomWords(2, q.word)]);
                        if (difficulty === 'medium') options = shuffle([q.word, ...getRandomWords(3, q.word)]);
                    } else if (gameMode === 'category') {
                        correctAnswer = q.category;
                        prompt = q.word;
                        if (difficulty === 'easy') {
                            const otherCats = shuffle(categoriesList.filter(c => c !== q.category)).slice(0, 1);
                            options = shuffle([q.category, ...otherCats]);
                        } else if (difficulty === 'medium') {
                            const otherCats = shuffle(categoriesList.filter(c => c !== q.category)).slice(0, 3);
                            options = shuffle([q.category, ...otherCats]);
                        } else {
                            options = shuffle([...categoriesList]); // Hard: All categories
                        }
                    }
                    
                    return { original: q, prompt, correctAnswer, options };
                });
                
                setQuestions(preparedQuestions);
            }, [difficulty, gameMode]);

            if (questions.length === 0) return <div className="p-10 text-center">Cargando...</div>;

            const currentQ = questions[currentIndex];
            const isHard = difficulty === 'hard';
            const isTypingMode = isHard && gameMode !== 'category';
            const progress = ((currentIndex) / questions.length) * 100;

            const handleAnswer = (answer) => {
                if (feedback) return; 
                
                const isCorrect = answer.toLowerCase().trim() === currentQ.correctAnswer.toLowerCase();
                if (isCorrect) setScore(s => s + 1);
                
                setFeedback({ isCorrect, selected: answer });
            };

            const handleNext = () => {
                if (currentIndex < questions.length - 1) {
                    setCurrentIndex(i => i + 1);
                    setFeedback(null);
                    setTypedAnswer("");
                } else {
                    onFinish(score + (feedback?.isCorrect ? 1 : 0), questions.length);
                }
            };

            return (
                <div className="flex flex-col min-h-screen">
                    {/* Header & Progress */}
                    <div className="glass-header p-4 z-10 flex flex-col gap-3">
                        <div className="flex justify-between items-center">
                            <button onClick={onBack} className="text-slate-400 hover:text-slate-200 bg-white/5 p-1 rounded-full">
                                <Icon name="x" className="w-6 h-6" />
                            </button>
                            <span className="font-bold text-slate-300 uppercase text-xs tracking-widest bg-black/20 px-3 py-1 rounded-full border border-white/5">
                                Pregunta {currentIndex + 1} / {questions.length}
                            </span>
                            <span className="font-bold text-blue-300 bg-white/5 px-3 py-1 rounded-full border border-blue-400/20">⭐ {score}</span>
                        </div>
                        <div className="w-full bg-black/30 rounded-full h-2 overflow-hidden border border-white/5">
                            <div className="bg-gradient-to-r from-blue-500 to-cyan-500 h-2 rounded-full transition-all duration-500 shadow-[0_0_10px_rgba(59,130,246,0.6)]" style={{ width: `${progress}%` }}></div>
                        </div>
                    </div>

                    {/* Question Area */}
                    <div className="flex-1 flex flex-col p-5">
                        <div className="glass-panel p-8 mb-8 text-center min-h-[160px] flex flex-col justify-center slide-up shadow-2xl relative overflow-hidden">
                            <div className="absolute inset-0 bg-gradient-to-b from-white/5 to-transparent"></div>
                            <p className="text-xs font-bold text-blue-300 mb-4 uppercase tracking-widest relative z-10 bg-blue-500/10 inline-block mx-auto px-3 py-1 rounded-full border border-blue-500/20">
                                {gameMode === 'category' ? 'Clasificador' : currentQ.original.category}
                            </p>
                            <h2 className="text-2xl font-medium text-slate-50 leading-relaxed relative z-10">
                                {gameMode === 'cloze' && currentQ.prompt.split('[blank]').map((part, i, arr) => (
                                    <React.Fragment key={i}>
                                        {part}
                                        {i !== arr.length - 1 && (
                                            <span className={`inline-block border-b-2 mx-1 px-3 font-bold min-w-[70px] text-center pb-1 ${
                                                feedback 
                                                    ? (feedback.isCorrect ? 'border-emerald-400 text-emerald-300' : 'border-rose-400 text-rose-300')
                                                    : 'border-slate-400 text-slate-200'
                                            }`}>
                                                {feedback ? (feedback.isCorrect ? currentQ.correctAnswer : feedback.selected || '___') : (isTypingMode ? typedAnswer || '___' : '___')}
                                            </span>
                                        )}
                                    </React.Fragment>
                                ))}
                                {gameMode === 'translation' && (
                                    <span>Traducción:<br/><strong className="text-blue-200 block mt-2 text-3xl">"{currentQ.prompt}"</strong></span>
                                )}
                                {gameMode === 'category' && (
                                    <span>¿A qué categoría pertenece:<br/><strong className="text-amber-200 block mt-2 text-4xl tracking-tight">"{currentQ.prompt}"</strong>?</span>
                                )}
                            </h2>
                        </div>

                        {/* Interactive Area */}
                        <div className="flex-1 flex flex-col justify-end pb-4 slide-up" style={{animationDelay: '0.1s'}}>
                            {!isTypingMode ? (
                                <div className="space-y-4">
                                    {currentQ.options.map((opt, idx) => {
                                        let btnClass = "w-full p-4 rounded-3xl font-semibold text-lg border transition-all active:scale-95 text-left pl-6 backdrop-blur-md ";
                                        if (!feedback) {
                                            btnClass += "bg-white/5 border-white/10 text-slate-200 hover:border-blue-400/50 hover:bg-white/10 shadow-lg";
                                        } else {
                                            if (opt === currentQ.correctAnswer) {
                                                btnClass += "bg-emerald-500/20 border-emerald-400/50 text-emerald-300 shadow-[0_0_20px_rgba(16,185,129,0.3)]"; // Correct always highlighted
                                            } else if (opt === feedback.selected) {
                                                btnClass += "bg-rose-500/20 border-rose-400/50 text-rose-300 shake shadow-[0_0_20px_rgba(244,63,94,0.3)]"; // Wrong selection
                                            } else {
                                                btnClass += "bg-black/20 border-white/5 text-slate-500 opacity-50"; // Others faded
                                            }
                                        }

                                        return (
                                            <button 
                                                key={idx} 
                                                onClick={() => handleAnswer(opt)}
                                                disabled={feedback !== null}
                                                className={btnClass}
                                            >
                                                {opt}
                                            </button>
                                        );
                                    })}
                                </div>
                            ) : (
                                <div className="space-y-4">
                                    <input 
                                        type="text" 
                                        value={typedAnswer}
                                        onChange={(e) => setTypedAnswer(e.target.value)}
                                        disabled={feedback !== null}
                                        placeholder="Escribe la palabra en inglés..."
                                        className={`w-full p-5 rounded-3xl font-semibold text-xl border outline-none text-center transition-colors shadow-lg backdrop-blur-md ${
                                            feedback 
                                                ? (feedback.isCorrect ? 'bg-emerald-500/20 border-emerald-400/50 text-emerald-300' : 'bg-rose-500/20 border-rose-400/50 text-rose-300')
                                                : 'bg-black/30 border-white/10 text-slate-100 focus:border-blue-400/60 focus:bg-black/40'
                                        }`}
                                        onKeyPress={(e) => {
                                            if (e.key === 'Enter' && typedAnswer && !feedback) {
                                                handleAnswer(typedAnswer);
                                            }
                                        }}
                                    />
                                    {!feedback && (
                                        <button 
                                            onClick={() => handleAnswer(typedAnswer)}
                                            disabled={!typedAnswer.trim()}
                                            className="w-full p-4 bg-blue-600/80 backdrop-blur-md text-white rounded-3xl font-bold text-lg disabled:opacity-50 active:scale-95 transition shadow-[0_4px_15px_rgba(59,130,246,0.4)] border border-blue-400/30"
                                        >
                                            Comprobar
                                        </button>
                                    )}
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Feedback Modal Overlay */}
                    {feedback && (
                        <div className="absolute bottom-0 left-0 right-0 glass-panel rounded-t-[2.5rem] rounded-b-none p-6 slide-up z-20 border-t border-white/10 max-h-[85vh] overflow-y-auto">
                            <div className="flex items-start gap-4 mb-5">
                                <div className={`w-14 h-14 rounded-full flex items-center justify-center shrink-0 shadow-lg ${feedback.isCorrect ? 'bg-emerald-500/20 border border-emerald-500/40' : 'bg-rose-500/20 border border-rose-500/40'}`}>
                                    {feedback.isCorrect ? (
                                        <Icon name="check" className="w-8 h-8 text-emerald-400" />
                                    ) : (
                                        <Icon name="x" className="w-8 h-8 text-rose-400" />
                                    )}
                                </div>
                                <div className="flex-1 mt-1">
                                    <h3 className={`text-2xl font-extrabold tracking-tight ${feedback.isCorrect ? 'text-emerald-400' : 'text-rose-400'}`}>
                                        {feedback.isCorrect ? '¡Excelente!' : 'Casi...'}
                                    </h3>
                                    {!feedback.isCorrect && (
                                        <p className="text-slate-300 mt-1">
                                            La correcta era <strong className="text-white bg-white/10 px-2 py-0.5 rounded-md">{currentQ.correctAnswer}</strong>.
                                        </p>
                                    )}
                                </div>
                            </div>
                            
                            {/* Learning context added in feedback */}
                            <div className="mb-6 space-y-4 bg-black/20 p-5 rounded-3xl border border-white/5">
                                <div>
                                    <p className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1.5 flex items-center gap-2">
                                        🇪🇸 Significado ({currentQ.original.word})
                                    </p>
                                    <p className="text-slate-200 text-sm font-medium">"{currentQ.original.meaning}"</p>
                                </div>
                                <div className="h-px w-full bg-white/10"></div>
                                <div>
                                    <p className="text-xs font-bold text-blue-300 uppercase tracking-widest mb-1.5 flex items-center gap-2">
                                        💡 Regla de uso
                                    </p>
                                    <p className="text-slate-300 text-sm leading-relaxed">{currentQ.original.usage}</p>
                                </div>
                            </div>

                            <button 
                                onClick={handleNext}
                                className={`w-full p-4 rounded-3xl font-bold text-lg text-white transition active:scale-95 shadow-lg border ${
                                    feedback.isCorrect 
                                        ? 'bg-emerald-600/80 hover:bg-emerald-500/80 border-emerald-400/40 shadow-[0_4px_20px_rgba(16,185,129,0.3)]' 
                                        : 'bg-rose-600/80 hover:bg-rose-500/80 border-rose-400/40 shadow-[0_4px_20px_rgba(244,63,94,0.3)]'
                                }`}
                            >
                                {currentIndex < questions.length - 1 ? 'Siguiente Pregunta' : 'Ver Resultados'}
                            </button>
                        </div>
                    )}
                </div>
            );
        };

        // 6. End Screen
        const ScoreScreen = ({ score, total, onHome }) => {
            const percentage = Math.round((score / total) * 100);
            let message = "¡Sigue practicando!";
            let color = "text-rose-400";
            let shadowColor = "rgba(244,63,94,0.3)";
            
            if (percentage >= 80) { 
                message = "¡Excelente trabajo!"; 
                color = "text-emerald-400"; 
                shadowColor = "rgba(16,185,129,0.3)";
            }
            else if (percentage >= 50) { 
                message = "¡Buen intento!"; 
                color = "text-amber-400"; 
                shadowColor = "rgba(243,156,18,0.3)";
            }

            return (
                <div className="flex flex-col items-center justify-center min-h-screen p-6 text-center fade-in">
                    <div className="glass-panel p-10 flex flex-col items-center w-full max-w-sm">
                        <div className="w-36 h-36 bg-black/30 rounded-full flex items-center justify-center mb-8 relative border border-white/5 backdrop-blur-xl" style={{boxShadow: `0 0 40px ${shadowColor}`}}>
                            <svg className="w-full h-full absolute top-0 left-0" viewBox="0 0 36 36">
                                <path
                                    className="text-white/5"
                                    strokeWidth="3"
                                    stroke="currentColor"
                                    fill="none"
                                    d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"
                                />
                                <path
                                    className={color.replace('text-', 'text-')}
                                    strokeWidth="3"
                                    strokeDasharray={`${percentage}, 100`}
                                    stroke="currentColor"
                                    fill="none"
                                    d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"
                                />
                            </svg>
                            <span className={`text-4xl font-extrabold ${color}`}>{percentage}%</span>
                        </div>
                        
                        <h2 className="text-3xl font-extrabold text-slate-50 mb-2">Resultados</h2>
                        <p className="text-xl text-slate-300 mb-3 bg-white/5 px-4 py-1 rounded-full border border-white/10">{score} de {total} correctas</p>
                        <p className={`font-bold mb-10 text-xl ${color}`}>{message}</p>
                        
                        <button 
                            onClick={onHome}
                            className="w-full py-4 bg-blue-600/80 backdrop-blur-md text-white rounded-3xl font-bold text-lg shadow-[0_4px_15px_rgba(59,130,246,0.4)] hover:bg-blue-500/80 transition active:scale-95 border border-blue-400/30"
                        >
                            Volver al Inicio
                        </button>
                    </div>
                </div>
            );
        };

        // Main App Component
        const App = () => {
            const [view, setView] = useState('home'); // home, learn, game_modes, game_setup, game, score
            const [gameParams, setGameParams] = useState({ mode: 'cloze', difficulty: 'easy' });
            const [scoreParams, setScoreParams] = useState({ score: 0, total: 10 });

            const handleNavigate = (newView) => setView(newView);
            
            const handleSelectMode = (mode) => {
                setGameParams(prev => ({ ...prev, mode }));
                setView('game_setup');
            };

            const handleStartGame = (difficulty) => {
                setGameParams(prev => ({ ...prev, difficulty }));
                setView('game');
            };

            const handleGameFinish = (score, total) => {
                setScoreParams({ score, total });
                setView('score');
            };

            return (
                <div className="app-container relative">
                    {/* Background Ambient Orbs */}
                    <div className="fixed inset-0 z-[-1] bg-slate-950 overflow-hidden pointer-events-none">
                        <div className="absolute top-[-10%] left-[-20%] w-96 h-96 bg-blue-600/30 rounded-full blur-[100px]"></div>
                        <div className="absolute bottom-[-10%] right-[-20%] w-96 h-96 bg-cyan-600/20 rounded-full blur-[100px]"></div>
                        <div className="absolute top-[40%] left-[60%] w-72 h-72 bg-emerald-600/20 rounded-full blur-[100px]"></div>
                    </div>

                    <div className="relative z-0 min-h-screen">
                        {view === 'home' && <HomeScreen onNavigate={handleNavigate} />}
                        {view === 'learn' && <LearnScreen onBack={() => handleNavigate('home')} />}
                        {view === 'game_modes' && <GameModesScreen onBack={() => handleNavigate('home')} onSelectMode={handleSelectMode} />}
                        {view === 'game_setup' && <GameSetupScreen gameMode={gameParams.mode} onBack={() => handleNavigate('game_modes')} onStartGame={handleStartGame} />}
                        {view === 'game' && <GameScreen gameMode={gameParams.mode} difficulty={gameParams.difficulty} onBack={() => handleNavigate('game_modes')} onFinish={handleGameFinish} />}
                        {view === 'score' && <ScoreScreen score={scoreParams.score} total={scoreParams.total} onHome={() => handleNavigate('home')} />}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
